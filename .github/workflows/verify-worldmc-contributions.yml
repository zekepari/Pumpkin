name: Verify WorldMC contributions

on:
  push:
    branches:
      - verify/worldmc-contributions

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: fix/chunk-heightmap-coordinates
            test: placed_blocks_update_only_their_heightmap_column
          - ref: fix/preserve-imported-structures
            test: imported_structures_survive_anvil_save_and_pump_resume
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 2
      - name: Install stable Rust
        run: rustup update stable
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test the world crate
        run: cargo test --locked -p pumpkin-world --lib
        env:
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_TEST_DEBUG: 0
      - name: Lint the world crate
        run: cargo clippy --locked -p pumpkin-world --lib --tests -- -D warnings
        env:
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_DEV_DEBUG: 0
